name: Publicar app de escritorio

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Crea (o reutiliza) un único borrador de release antes de compilar, para que
  # las plataformas en paralelo no creen borradores duplicados.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Práctica de canciones ${version}`,
              body: 'Descarga el instalador de tu sistema desde los archivos adjuntos.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,rpm,deb
          - platform: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libssl-dev curl wget file libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BASE: /
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
